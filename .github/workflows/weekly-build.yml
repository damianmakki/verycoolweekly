name: Build weekly editions
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Friday, 13:00 UTC. Scheduled editions become eligible by date (UTC).
    - cron: '0 13 * * 5'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: verycoolweekly-web-and-email
          path: |
            dist/
            exports/emails/
          retention-days: 14
